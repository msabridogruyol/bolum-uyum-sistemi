# [2026-10-09] Render'ın ücretsiz planı 15 dakika istek almayan sunucuyu uyutur; ilk istek 30-60 sn bekler.
# Bu iş 10 dakikada bir sağlık adresine istek atarak sunucuyu uyanık tutar (GitHub Actions, ücretsiz).
# Not: GitHub zamanlanmış işleri birkaç dakika gecikmeli çalıştırabilir; 60 gün hiç commit olmazsa işi duraklatır.
name: Sunucuyu uyanik tut

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Saglik kontrolu
        run: |
          for i in 1 2 3; do
            kod=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://bolum-uyum-sistemi.onrender.com/saglik) && echo "HTTP $kod"
            [ "$kod" = "200" ] && exit 0
            sleep 10
          done
          echo "Sunucu yanit vermedi"; exit 0
