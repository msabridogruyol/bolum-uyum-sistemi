# [2026-10-11] Otomatik testler: her push ve pull request'te backend (pytest + PostgreSQL) ve frontend (vite build).
# Şema: `alembic upgrade head` boş veritabanında baştan sona çalışmıyor (0001'in yorum içi ';' bölmesi, VARCHAR(32)
# alembic_version, yalnızca ORM'de tanımlı tablolar) — bu yüzden backend/scripts/test_semasi_kur.py kullanılır
# (0001 DDL + ORM + tüm göçler hoşgörülü + uygulamanın kendi sema_guncelleme'si). Ayrıntı: o dosyanın başı.
name: Testler

on:
  push:
  pull_request:

concurrency:
  group: testler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filizyol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filizyol_test
      JWT_SECRET_KEY: ci-test-anahtari-uretimde-kullanilmaz
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Bağımlılıklar
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Uygulama içe aktarılıyor mu
        run: python -c "import app.main"
      - name: Test şeması
        run: python scripts/test_semasi_kur.py
      - name: pytest
        run: python -m pytest -ra

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vite build
