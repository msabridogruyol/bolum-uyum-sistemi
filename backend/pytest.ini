[pytest]
# [2026-10-11] Test paketi: backend/tests/ (kökteki eski test_*.py betikleri tests/test_mevcut_betikler.py ile ayrı süreçte çalıştırılır).
# app/ altındaki test_hesaplari.py / test_hesabi_servisi.py uygulama modülüdür, test değildir — bu yüzden testpaths sabit.
testpaths = tests
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
